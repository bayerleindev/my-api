spring:
  application:
    name: system-info-api

app:
  version: ${APP_VERSION:grey}
  color: ${APP_COLOR:grey}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.example.systeminfo: INFO
