spring:
  application:
    name: system-info-api

app:
  version: ${APP_VERSION:amarelo}
  color: ${APP_COLOR:amarelo}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${APP_VERSION:unknown}
      color: ${APP_COLOR:unknown}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO
    com.example.systeminfo: INFO
